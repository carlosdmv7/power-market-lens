version: 2

sources:
  - name: entsoe
    description: >
      ENTSO-E Transparency Platform documents, appended by the Python loader
      (src/power_market_lens/ingest). Append-only: every pull adds rows, so a
      point appears once per load that covered it (ADR-003).
    schema: raw
    tables:
      - name: day_ahead_prices
        identifier: entsoe_day_ahead_prices
        description: Day-ahead prices (document A44), one row per published interval per load.
        config:
          # Freshness is judged on the newest delivery interval, not on when
          # the loader last ran: a pipeline that runs but fetches nothing new
          # must still turn this red. Day-ahead prices reach into tomorrow, so
          # a healthy table is "fresh into the future".
          loaded_at_field: period_start_utc
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 36, period: hour}
        columns:
          - name: bidding_zone_eic
            description: EIC code of the bidding zone the price is for.
          - name: period_start_utc
            description: Start of the market time unit, UTC.
          - name: resolution_minutes
            description: Length of the market time unit in minutes (15 or 60; 30 in a few zones).
          - name: price_eur_mwh
            description: Clearing price as published.
          - name: currency
            description: Currency of the price, expected EUR.
          - name: price_unit
            description: Energy unit of the price, expected MWH.
          - name: document_mrid
            description: >-
              Identifier of the ENTSO-E response the point came from. Regenerated on
              every request, so it names a download, not a version of the data.
          - name: document_created_at
            description: >-
              When ENTSO-E generated the response, UTC. The platform builds a document
              per request, so this is the request time, not when the data was published.
          - name: _loaded_at
            description: When the loader appended the batch, UTC. Same for every row of a batch.
          - name: _source
            description: Source and document type, e.g. entsoe:A44.
          - name: _window_start
            description: Start of the window the load requested, UTC.
          - name: _window_end
            description: End of the window the load requested, UTC (exclusive).
          - name: _run_id
            description: Prefect flow-run id of the load, or a label for manual runs.

      - name: generation_per_type
        identifier: entsoe_generation_per_type
        description: Actual generation per production type (document A75), one row per interval per load.
        config:
          loaded_at_field: period_start_utc
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 36, period: hour}
        columns:
          - name: bidding_zone_eic
            description: EIC code of the bidding zone.
          - name: psr_type
            description: ENTSO-E production type code (B01–B25).
          - name: flow_direction
            description: generation (into the zone) or consumption (out of it, e.g. pumping).
          - name: period_start_utc
            description: Start of the interval, UTC.
          - name: resolution_minutes
            description: Length of the interval in minutes.
          - name: quantity_mw
            description: Average power over the interval, MW.
          - name: document_mrid
            description: >-
              Identifier of the ENTSO-E response the point came from. Regenerated on
              every request, so it names a download, not a version of the data.
          - name: document_created_at
            description: >-
              When ENTSO-E generated the response, UTC. The platform builds a document
              per request, so this is the request time, not when the data was published.
          - name: _loaded_at
            description: When the loader appended the batch, UTC.
          - name: _source
            description: Source and document type, e.g. entsoe:A75.
          - name: _window_start
            description: Start of the window the load requested, UTC.
          - name: _window_end
            description: End of the window the load requested, UTC (exclusive).
          - name: _run_id
            description: Prefect flow-run id of the load, or a label for manual runs.
      - name: crossborder_flows
        identifier: entsoe_crossborder_flows
        description: >
          Physical flows (document A11), one row per direction, interval and
          load. Each direction of a border is its own non-negative series.
        config:
          loaded_at_field: period_start_utc
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 36, period: hour}
        columns:
          - name: out_zone_eic
            description: EIC code of the zone the flow leaves.
          - name: in_zone_eic
            description: EIC code of the zone the flow enters.
          - name: period_start_utc
            description: Start of the interval, UTC.
          - name: resolution_minutes
            description: Length of the interval in minutes (60 on some borders, 15 on most).
          - name: flow_mw
            description: Average physical flow over the interval in this direction, MW; never negative.
          - name: document_mrid
            description: >-
              Identifier of the ENTSO-E response the point came from. Regenerated on
              every request, so it names a download, not a version of the data.
          - name: document_created_at
            description: >-
              When ENTSO-E generated the response, UTC. The platform builds a document
              per request, so this is the request time, not when the data was published.
          - name: _loaded_at
            description: When the loader appended the batch, UTC.
          - name: _source
            description: Source and document type, entsoe:A11.
          - name: _window_start
            description: Start of the window the load requested, UTC.
          - name: _window_end
            description: End of the window the load requested, UTC (exclusive).
          - name: _run_id
            description: Prefect flow-run id of the load, or a label for manual runs.
