version: 2

exposures:
  - name: streamlit_app
    label: Power Market Lens app
    type: application
    maturity: medium
    url: https://power-market-lens-carlosdmv7.streamlit.app/
    description: >
      The public Streamlit app: a zone page (price, generation mix, demand
      against forecast, carbon intensity, unusual hours), a map page (one
      day's mean price per zone with net cross-border flows) and a households
      page (what a household pays per kWh, and its components). It reads
      these marts and the monitor's table, and nothing else;
      tests/app/test_exposure.py keeps this list equal to what app/data.py
      queries.
    depends_on:
      - source('monitor', 'system_conditions_hourly')
      - ref('dim_bidding_zone')
      - ref('fct_day_ahead_price_hourly')
      - ref('fct_generation_hourly')
      - ref('fct_generation_mix_hourly')
      - ref('fct_household_price_components_yearly')
      - ref('fct_household_price_halfyearly')
      - ref('fct_interchange_hourly')
      - ref('fct_load_hourly')
    owner:
      name: Carlos De Manuel
