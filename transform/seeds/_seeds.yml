version: 2

seeds:
  - name: bidding_zones
    description: >
      One row per bidding zone, keyed by its ENTSO-E EIC code. Maps each zone to
      its country and to the IANA time zone its delivery day is defined in, which
      is how marts derive local dates and hours (ADR-003). Since Phase 1: Spain,
      Portugal, France, Germany–Luxembourg, the Netherlands and Italy's seven
      zones. A zone spanning two countries (DE-LU) is filed under the larger.
    config:
      column_types:
        bidding_zone_eic: varchar
        zone_code: varchar
        zone_name: varchar
        country_code: varchar
        country_name: varchar
        timezone: varchar
    columns:
      - name: bidding_zone_eic
        description: ENTSO-E Energy Identification Code of the bidding zone, e.g. 10YES-REE------0.
        data_tests:
          - unique
          - not_null
      - name: zone_code
        description: Short zone label used in the app, e.g. ES, DE-LU, IT-NORD.
        data_tests:
          - unique
          - not_null
      - name: zone_name
        description: Zone name for display, e.g. Germany–Luxembourg, Italy Centre-North.
        data_tests:
          - unique
          - not_null
      - name: country_code
        description: ISO 3166-1 alpha-2 code of the zone's country. Several zones can share one (Italy).
        data_tests:
          - not_null
      - name: country_name
        description: Country name in English.
        data_tests:
          - not_null
      - name: timezone
        description: IANA time zone of the zone's delivery day, e.g. Europe/Madrid.
        data_tests:
          - not_null

  - name: sdac_price_limits
    description: >
      SDAC harmonised minimum and maximum clearing prices, with the period each
      pair was in force. The limits move automatically under the HMMCP
      methodology, so prices are checked against the pair valid on their
      delivery date rather than a fixed range (ADR-003). Periods are half-open:
      valid_from inclusive, valid_to exclusive, a null valid_to means "still in
      force".
    config:
      column_types:
        valid_from: date
        valid_to: date
        min_price_eur_mwh: decimal(10, 2)
        max_price_eur_mwh: decimal(10, 2)
        note: varchar
    columns:
      - name: valid_from
        description: First delivery date (inclusive) on which these limits apply.
        data_tests:
          - unique
          - not_null
      - name: valid_to
        description: First delivery date on which these limits no longer apply (exclusive); null while in force.
      - name: min_price_eur_mwh
        description: Harmonised minimum clearing price, EUR/MWh.
        data_tests:
          - not_null
      - name: max_price_eur_mwh
        description: Harmonised maximum clearing price, EUR/MWh.
        data_tests:
          - not_null
      - name: note
        description: Why the limits changed, for the reader of the seed.

  - name: entsoe_psr_types
    description: >
      ENTSO-E production (PSR) type codes and their names, as used by the
      actual generation per production type document (A75). Grouping into
      technologies, renewable flags and emission factors come in Phase 1.
    config:
      column_types:
        psr_type: varchar
        psr_name: varchar
    columns:
      - name: psr_type
        description: ENTSO-E PSR type code, B01 to B25.
        data_tests:
          - unique
          - not_null
      - name: psr_name
        description: ENTSO-E's English name for the production type.
        data_tests:
          - unique
          - not_null

  - name: neighbour_zones
    description: >
      Bidding zones outside the model that border one of its zones. Only their
      physical flows with a modelled zone are loaded, so they appear in the
      marts as counterparts, never as zones of their own. Same keys as
      bidding_zones; a Python test keeps it in sync with zones.NEIGHBOURS.
    config:
      column_types:
        bidding_zone_eic: varchar
        zone_code: varchar
        zone_name: varchar
        country_code: varchar
        country_name: varchar
    columns:
      - name: bidding_zone_eic
        description: ENTSO-E Energy Identification Code of the bidding zone.
        data_tests:
          - unique
          - not_null
      - name: zone_code
        description: Short zone label, e.g. CH, DK-1.
        data_tests:
          - unique
          - not_null
      - name: zone_name
        description: Zone name for display, e.g. Denmark West.
        data_tests:
          - unique
          - not_null
      - name: country_code
        description: ISO 3166-1 alpha-2 code of the zone's country.
        data_tests:
          - not_null
      - name: country_name
        description: Country name in English.
        data_tests:
          - not_null
