version: 2

seeds:
  - name: bidding_zones
    description: >
      One row per bidding zone, keyed by its ENTSO-E EIC code. Maps each zone to
      its country and to the IANA time zone its delivery day is defined in, which
      is how marts derive local dates and hours (ADR-003). Since Phase 1: Spain,
      Portugal, France, Germany–Luxembourg, the Netherlands and Italy's seven
      zones. A zone spanning two countries (DE-LU) is filed under the larger.
    config:
      column_types:
        bidding_zone_eic: varchar
        zone_code: varchar
        zone_name: varchar
        country_code: varchar
        country_name: varchar
        timezone: varchar
    columns:
      - name: bidding_zone_eic
        description: ENTSO-E Energy Identification Code of the bidding zone, e.g. 10YES-REE------0.
        data_tests:
          - unique
          - not_null
      - name: zone_code
        description: Short zone label used in the app, e.g. ES, DE-LU, IT-NORD.
        data_tests:
          - unique
          - not_null
      - name: zone_name
        description: Zone name for display, e.g. Germany–Luxembourg, Italy Centre-North.
        data_tests:
          - unique
          - not_null
      - name: country_code
        description: ISO 3166-1 alpha-2 code of the zone's country. Several zones can share one (Italy).
        data_tests:
          - not_null
      - name: country_name
        description: Country name in English.
        data_tests:
          - not_null
      - name: timezone
        description: IANA time zone of the zone's delivery day, e.g. Europe/Madrid.
        data_tests:
          - not_null

  - name: sdac_price_limits
    description: >
      SDAC harmonised minimum and maximum clearing prices, with the period each
      pair was in force. The limits move automatically under the HMMCP
      methodology, so prices are checked against the pair valid on their
      delivery date rather than a fixed range (ADR-003). Periods are half-open:
      valid_from inclusive, valid_to exclusive, a null valid_to means "still in
      force".
    config:
      column_types:
        valid_from: date
        valid_to: date
        min_price_eur_mwh: decimal(10, 2)
        max_price_eur_mwh: decimal(10, 2)
        note: varchar
    columns:
      - name: valid_from
        description: First delivery date (inclusive) on which these limits apply.
        data_tests:
          - unique
          - not_null
      - name: valid_to
        description: First delivery date on which these limits no longer apply (exclusive); null while in force.
      - name: min_price_eur_mwh
        description: Harmonised minimum clearing price, EUR/MWh.
        data_tests:
          - not_null
      - name: max_price_eur_mwh
        description: Harmonised maximum clearing price, EUR/MWh.
        data_tests:
          - not_null
      - name: note
        description: Why the limits changed, for the reader of the seed.

  - name: entsoe_psr_types
    description: >
      ENTSO-E production (PSR) type codes and their names, as used by the
      actual generation per production type document (A75). Their grouping
      into technologies, flags and emission factors is technology_mapping.
    config:
      column_types:
        psr_type: varchar
        psr_name: varchar
    columns:
      - name: psr_type
        description: ENTSO-E PSR type code, B01 to B25.
        data_tests:
          - unique
          - not_null
          # Every code is classified: a type missing from the mapping would
          # drop out of every share and intensity.
          - relationships:
              arguments:
                to: ref('technology_mapping')
                field: psr_type
      - name: psr_name
        description: ENTSO-E's English name for the production type.
        data_tests:
          - unique
          - not_null

  - name: known_source_gaps
    description: >
      Local delivery days a mart cannot complete because the publisher never
      released the data, each checked by re-requesting it from the source.
      complete_local_days skips these (model, zone, day) rows and still fails
      on any other incomplete day, so a new gap is reported, not hidden. If the
      publisher later fills a gap, the row becomes harmless and can be removed.
    config:
      column_types:
        model_name: varchar
        bidding_zone_eic: varchar
        zone_code: varchar
        delivery_date_local: date
        missing_local_hours: varchar
        reason: varchar
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [model_name, bidding_zone_eic, delivery_date_local]
    columns:
      - name: model_name
        description: Mart the gap shows in, e.g. fct_generation_hourly.
        data_tests:
          - not_null
      - name: bidding_zone_eic
        description: EIC code of the bidding zone with the gap.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('bidding_zones')
                field: bidding_zone_eic
      - name: zone_code
        description: Short zone label, for reading the file; the EIC code is what the test joins on.
      - name: delivery_date_local
        description: Local delivery day that is incomplete.
        data_tests:
          - not_null
      - name: missing_local_hours
        description: Local hours absent at the source, as a range, e.g. 13-23. Documentation only.
      - name: reason
        description: Why the data is missing and when it was last checked at the source.
        data_tests:
          - not_null

  - name: technology_mapping
    description: >
      What each ENTSO-E production type is (ADR-004): its technology, the app's
      display group, whether it is renewable, low-carbon or storage, and which
      IPCC AR5 lifecycle factor it takes. A type with no AR5 row of its own
      takes a stated proxy and is flagged, so every carbon intensity can say
      how much of it rests on proxies.
    config:
      column_types:
        psr_type: varchar
        technology: varchar
        display_group: varchar
        is_renewable: boolean
        is_low_carbon: boolean
        is_storage: boolean
        factor_technology: varchar
        is_proxy_factor: boolean
        note: varchar
    columns:
      - name: psr_type
        description: ENTSO-E PSR type code, B01 to B25.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('entsoe_psr_types')
                field: psr_type
      - name: technology
        description: Short technology name for display.
        data_tests:
          - not_null
      - name: display_group
        description: >-
          One of the five groups the app colours (Nuclear, Fossil, Hydro & other,
          Solar, Wind); null for network elements, which never generate.
        data_tests:
          - accepted_values:
              arguments:
                values: [Nuclear, Fossil, Hydro & other, Solar, Wind]
      - name: is_renewable
        description: Renewable source. Waste and pumped storage are not.
        data_tests:
          - not_null
      - name: is_low_carbon
        description: Renewable or nuclear.
        data_tests:
          - not_null
      - name: is_storage
        description: Re-delivers stored energy (pumped hydro, batteries); left out of production-based shares and intensity.
        data_tests:
          - not_null
      - name: factor_technology
        description: The AR5 row whose lifecycle factor applies; null for storage and network elements.
        data_tests:
          - relationships:
              arguments:
                to: ref('emission_factors_ipcc_ar5')
                field: technology
      - name: is_proxy_factor
        description: True when AR5 has no row for this type and another row stands in for it.
        data_tests:
          - not_null
      - name: note
        description: Why a proxy or a classification was chosen.

  - name: emission_factors_ipcc_ar5
    description: >
      Lifecycle greenhouse-gas emissions of electricity supply technologies,
      including the albedo effect, in gCO2eq per kWh: IPCC AR5 Working Group
      III, Annex III, Table A.III.2 (2014), "Currently commercially available
      technologies" plus Ocean, copied as printed. Lifecycle, not direct: the
      direct-emission medians are lower (coal 760, gas 370).
    config:
      column_types:
        technology: varchar
        lifecycle_min_g_per_kwh: double
        lifecycle_median_g_per_kwh: double
        lifecycle_max_g_per_kwh: double
    columns:
      - name: technology
        description: Technology as named in the IPCC table.
        data_tests:
          - unique
          - not_null
      - name: lifecycle_min_g_per_kwh
        description: Minimum of the reviewed literature, gCO2eq/kWh.
      - name: lifecycle_median_g_per_kwh
        description: Median of the reviewed literature, gCO2eq/kWh. The value the marts use.
        data_tests:
          - not_null
      - name: lifecycle_max_g_per_kwh
        description: Maximum of the reviewed literature, gCO2eq/kWh.
