[project]
name = "power-market-lens"
version = "0.1.0"
description = "Analytics platform explaining European day-ahead electricity prices: generation mix, price drivers, household price composition and a forecast for Spain."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# 3.13 only (CLAUDE.md fixes the stack). Streamlit Community Cloud picks its own
# interpreter from its dashboard, so the app must be set to 3.13 there when it
# is deployed, or its install fails against this floor.
requires-python = ">=3.13,<3.14"
# Exact pins: uv.lock already pins transitively; pinning here as well makes an
# upgrade a deliberate, reviewable diff instead of a side effect of `uv lock`.
dependencies = [
    # ── Config ───────────────────────────────────────────────────────────────
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",   # typed settings from env vars and .env
    # ── Warehouse + transformations ──────────────────────────────────────────
    "duckdb==1.5.6",
    "dbt-core==1.12.6",
    "dbt-duckdb==1.11.0",
    # ── Ingestion ────────────────────────────────────────────────────────────
    "entsoe-py==0.8.1",            # ENTSO-E requests; we parse the XML ourselves
    "pandas==3.0.6",               # entsoe-py's timestamps; batch inserts into DuckDB
    "prefect>=3.8.8",
    "streamlit>=1.66.0",
]

[dependency-groups]
dev = [
    # Ruff is both linter and formatter. No black: two formatters means two
    # opinions about the same files.
    "ruff==0.17.1",
    "sqlfluff==4.4.0",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

# src/ layout: the package is importable only once installed, so tests run
# against the same thing a user would get, not whatever happens to be on the cwd.
# For a pure application with no package to install, set `package = false` under
# [tool.uv] and drop [build-system].
[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

# ══════════════════════════════════════════════════════════════════════════════
# Ruff — lint + format
# ══════════════════════════════════════════════════════════════════════════════
[tool.ruff]
# Must match the floor in requires-python, or ruff suggests syntax that crashes
# on the oldest interpreter you claim to support.
target-version = "py313"
line-length = 100
extend-exclude = ["data", "logs", "notebooks", "transform/target", "transform/dbt_packages"]

[tool.ruff.lint]
# E/W pycodestyle · F pyflakes · I isort · B bugbear · UP pyupgrade
# SIM simplify · C4 comprehensions · ARG unused args · PTH pathlib · PL pylint
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "ARG", "PTH", "PL"]
ignore = [
    "E501",     # long strings (SQL, messages) — the formatter handles code
    "PLR0913",  # too many arguments
    "PLR2004",  # magic values
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "PLR2004"]   # fixtures arrive as "unused" args
"scripts/*.py" = ["T201"]              # scripts may print
"__init__.py" = ["F401"]               # re-exports

[tool.ruff.lint.isort]
known-first-party = ["power_market_lens"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"

# ══════════════════════════════════════════════════════════════════════════════
# Pytest
# ══════════════════════════════════════════════════════════════════════════════
[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode imports each test file by path, so two folders that both
# contain a `tests` package never collide on the module name.
addopts = "--import-mode=importlib -ra"
